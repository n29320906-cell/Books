<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <title>Китеп Дүкөнү</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; color: white; }
        .container { text-align: center; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); padding: 50px 70px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h1 { font-size: 36px; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        .btn { padding: 12px 25px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-primary { background-color: #ff6b6b; color: white; }
        .btn-primary:hover { transform: translateY(-3px); }
        .btn-secondary { border: 2px solid white; color: white; }
        .btn-secondary:hover { background-color: white; color: #764ba2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Китеп Дүкөнү</h1>
        <div class="btn-group">
            <a href="/books/" class="btn btn-primary">Китептерди Көрүү</a>
            <a href="/add/" class="btn btn-secondary">Жаңы Китеп Кошуу</a>
            <a href="/favorites/" class="btn btn-secondary">❤️ Избранное</a>
        </div>
    </div>
</body>
</html>
