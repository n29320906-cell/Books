<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <title>Китеп Кошуу</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 40px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h1 { text-align: center; }
        button { background-color: #ff6b6b; color: white; border: none; padding: 12px 25px; border-radius: 30px; font-size: 16px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Жаңы Китеп Кошуу</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сактоо</button>
        </form>
        <a href="/">Башкы бетке</a>
    </div>
</body>
</html>
